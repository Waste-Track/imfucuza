services:
  - type: web
    name: engine-staging
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: free
    branch: main
    # GitHub Actions deploys tested commits through the deploy hook.
    autoDeployTrigger: "off"
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: UV_PYTHON_PREFERENCE
        value: only-system
      - key: ENVIRONMENT
        value: staging
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: SMS_GATEWAY
        value: mnotify
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: PIN_PEPPER
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MNOTIFY_API_KEY
        sync: false
      - key: SUPABASE_SMS_HOOK_SECRET
        sync: false
      - key: USSD_PROVIDER
        sync: false
      - key: USSD_WEBHOOK_TOKEN
        sync: false
      - key: USSD_CODE
        sync: false

  - type: web
    name: engine
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: "off"
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: UV_PYTHON_PREFERENCE
        value: only-system
      - key: ENVIRONMENT
        value: production
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: SMS_GATEWAY
        value: mnotify
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: INTERNAL_SECRET
        sync: false
      - key: PIN_PEPPER
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: MNOTIFY_API_KEY
        sync: false
      - key: SUPABASE_SMS_HOOK_SECRET
        sync: false
      - key: USSD_PROVIDER
        sync: false
      - key: USSD_WEBHOOK_TOKEN
        sync: false
      - key: USSD_CODE
        sync: false
