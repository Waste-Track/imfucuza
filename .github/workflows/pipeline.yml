name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.pipeline == 'true' || github.event_name == 'workflow_dispatch' }}
      db: ${{ steps.filter.outputs.db == 'true' || github.event_name == 'workflow_dispatch' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.pipeline == 'true' || github.event_name == 'workflow_dispatch' }}
      intelligence: ${{ steps.filter.outputs.intelligence == 'true' || steps.filter.outputs.pipeline == 'true' || github.event_name == 'workflow_dispatch' }}
      workflows: ${{ steps.filter.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend.yml'
            db:
              - 'backend/supabase/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend.yml'
            intelligence:
              - 'intelligence/**'
              - '.github/workflows/intelligence.yml'
            pipeline:
              - '.github/workflows/pipeline.yml'
              - '.github/workflows/deploy.yml'
            workflows:
              - '.github/workflows/**'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -fsSLO "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${VERSION}_checksums.txt"
          grep "gitleaks_${VERSION}_linux_x64.tar.gz" "gitleaks_${VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --verbose .

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml

  intelligence:
    name: Intelligence
    needs: changes
    if: needs.changes.outputs.intelligence == 'true'
    uses: ./.github/workflows/intelligence.yml

  # The one check to require in branch protection: path-filtered jobs may be
  # skipped, and a skipped required check would otherwise block merging.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, secret-scan, workflow-lint, backend, frontend, intelligence]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All jobs passed or were skipped."

  deploy-staging:
    name: Deploy to staging
    needs: [changes, ci-ok]
    # always() is needed: without it, any skipped job upstream of ci-ok
    # (a folder that didn't change) would skip the deploy as well.
    if: >-
      always() && needs.ci-ok.result == 'success' && needs.changes.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ github.sha }}
      db: ${{ needs.changes.outputs.db == 'true' }}
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      intelligence: ${{ needs.changes.outputs.intelligence == 'true' }}
    secrets: inherit
